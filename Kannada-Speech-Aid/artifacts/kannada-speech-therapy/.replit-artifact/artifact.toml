kind = "web"
previewPath = "/"
title = "Kannada Speech Therapy"
version = "1.0.0"
id = "artifacts/kannada-speech-therapy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21680
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/kannada-speech-therapy run dev"

[services.env]
PORT = "21680"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/kannada-speech-therapy", "run", "build"]
publicDir = "artifacts/kannada-speech-therapy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
